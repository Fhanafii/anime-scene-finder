[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-scene-finder"
version = "0.5.0"
description = "Anime scene search embedding pipeline"
requires-python = ">=3.12"
dependencies = [
    "open_clip_torch>=2.26,<3",
    "pillow>=10,<12",
    "psycopg[binary]>=3.2,<4",
    "minio>=7.2,<8",
    "scenedetect[opencv]>=0.6,<1",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
    "torch>=2.2,<3",
]

[project.scripts]
anime-embed = "app.cli:main"
anime-index = "app.index_cli:main"

[tool.setuptools.packages.find]
where = ["api"]
